syntax = "proto3";

package game;

option go_package = "example.com/game/proto";

// 用户服务
service UserService {
  // 用户登录
  rpc Login(LoginRequest) returns (LoginResponse);
  // 用户注册
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // 获取用户资料
  rpc GetUserProfile(GetUserProfileRequest) returns (UserProfile);
  // 更新用户资料
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (CommonResponse);
}

// 游戏服务
service GameService {
  // 开始游戏
  rpc StartGame(StartGameRequest) returns (StartGameResponse);
  // 提交游戏结果
  rpc SubmitGameResult(SubmitGameResultRequest) returns (SubmitGameResultResponse);
  // 获取排行榜
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
}

// ============ 用户相关消息 ============

message LoginRequest {
  string username = 1;  // 用户名
  string password = 2;  // 密码
}

message LoginResponse {
  int32 code = 1;        // 状态码: 0-成功, 其他-失败
  string message = 2;    // 提示信息
  string token = 3;      // JWT token
  UserProfile user = 4;  // 用户信息
}

message RegisterRequest {
  string username = 1;   // 用户名 (3-20字符)
  string password = 2;   // 密码 (6-20字符)
  string email = 3;      // 邮箱
  string nickname = 4;   // 昵称
}

message RegisterResponse {
  int32 code = 1;
  string message = 2;
  int64 user_id = 3;     // 新建用户ID
}

message GetUserProfileRequest {
  int64 user_id = 1;     // 用户ID
}

message UpdateUserProfileRequest {
  int64 user_id = 1;
  string nickname = 2;   // 昵称
  string email = 3;      // 邮箱
}

message UserProfile {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  int32 level = 5;       // 等级
  int64 coins = 6;       // 金币
  int32 diamonds = 7;    // 钻石
  string last_login = 8; // 最后登录时间
}

message CommonResponse {
  int32 code = 1;
  string message = 2;
}

// ============ 游戏相关消息 ============

message StartGameRequest {
  int64 user_id = 1;
  int32 game_type = 2;   // 游戏类型: 1-竞速, 2-闯关, 3-对战
}

message StartGameResponse {
  int32 code = 1;
  string message = 2;
  string game_id = 3;    // 游戏房间ID
  int64 entry_fee = 4;   // 入场费(金币)
  GameConfig config = 5; // 游戏配置
}

message GameConfig {
  int32 duration = 1;    // 游戏时长限制(秒)
  int32 difficulty = 2;  // 难度: 1-简单, 2-普通, 3-困难
  repeated int32 rewards = 3; // 奖励档次
}

message SubmitGameResultRequest {
  string game_id = 1;
  int64 user_id = 2;
  int32 score = 3;       // 得分
  int32 duration = 4;    // 实际游戏时长
  string data = 5;       // 游戏数据(JSON)
}

message SubmitGameResultResponse {
  int32 code = 1;
  string message = 2;
  int64 coins_reward = 3;  // 金币奖励
  int32 exp_reward = 4;    // 经验奖励
  int32 rank = 5;          // 本局排名
}

message GetLeaderboardRequest {
  int32 game_type = 1;
  string period = 2;       // 周期: daily, weekly, monthly, all_time
  int32 page = 3;
  int32 page_size = 4;
}

message GetLeaderboardResponse {
  int32 code = 1;
  string message = 2;
  repeated LeaderboardEntry entries = 3;
  int32 total = 4;
}

message LeaderboardEntry {
  int32 rank = 1;
  int64 user_id = 2;
  string username = 3;
  string nickname = 4;
  int32 score = 5;
  int32 level = 6;
}

// ============ 错误码定义 ============
// 1000-1999: 用户相关
// 1001: 用户名或密码错误
// 1002: 账户已被锁定
// 1003: 参数格式错误
// 1004: 用户名已存在
// 1005: 邮箱已被注册
// 1006: Token 无效或已过期

// 2000-2999: 游戏相关
// 2001: 金币不足
// 2002: 游戏不存在
// 2003: 游戏已结束
// 2004: 提交数据异常
// 2005: 作弊检测失败
